[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budaolepao"
version = "0.1.0"
description = "步道乐跑 刷跑 + 反作弊检测"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "prettytable",
    "fastapi",
    "uvicorn",
    "pydantic",
    "rich",
    "pyperclip",
    "scikit-learn",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
]

[project.scripts]
lepao = "budaolepao_cli.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["budaolepao_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests", "poc/emulator_run", "detection/tests", "eval/tests"]
pythonpath = [".", "detection", "eval", "poc/emulator_run"]
addopts = "--import-mode=importlib"
