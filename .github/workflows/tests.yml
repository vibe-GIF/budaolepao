name: Offline checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test,mcp]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: lepao -h
      - run: lepao web --help
      - run: lepao mcp --help
